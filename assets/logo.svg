<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Linear Gradient for Outer Lens Ring -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B2C1" />
      <stop offset="50%" stop-color="#23717B" />
      <stop offset="100%" stop-color="#023859" />
    </linearGradient>

    <!-- Radial Gradient for Core Glow -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7EBF2" />
      <stop offset="40%" stop-color="#12B2C1" />
      <stop offset="100%" stop-color="#011C40" />
    </radialGradient>
  </defs>

  <!-- Background Base (Rounded Academic Tile) -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#011C40" stroke="#26658C" stroke-width="2" />

  <!-- Outer Optical Graticule (Subtle Grid) -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#023859" stroke-width="1.5" stroke-dasharray="2 4" />
  
  <!-- Main Optical Lens Ring -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="url(#lensGrad)" stroke-width="3.5" filter="url(#cyanGlow)" />

  <!-- Inner Astigmatic Reference Ring -->
  <circle cx="60" cy="60" r="24" fill="none" stroke="#26658C" stroke-width="1.5" />

  <!-- 4 Principal Meridians (Retinoscopy / Axis Crosshairs) -->
  <!-- Vertical (90 deg) -->
  <line x1="60" y1="16" x2="60" y2="30" stroke="#A7EBF2" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="90" x2="60" y2="104" stroke="#A7EBF2" stroke-width="2" stroke-linecap="round" />
  
  <!-- Horizontal (180 deg) -->
  <line x1="16" y1="60" x2="30" y2="60" stroke="#A7EBF2" stroke-width="2" stroke-linecap="round" />
  <line x1="90" y1="60" x2="104" y2="60" stroke="#A7EBF2" stroke-width="2" stroke-linecap="round" />

  <!-- Oblique 45/135 Degree Tick Markers -->
  <line x1="33" y1="33" x2="40" y2="40" stroke="#23717B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="87" y1="33" x2="80" y2="40" stroke="#23717B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="33" y1="87" x2="40" y2="80" stroke="#23717B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="87" y1="87" x2="80" y2="80" stroke="#23717B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Central Optical Axis / Pupil Aperture -->
  <circle cx="60" cy="60" r="10" fill="url(#coreGrad)" stroke="#E5F9F8" stroke-width="1.5" />
  
  <!-- Center Cyan Target Point -->
  <circle cx="60" cy="60" r="3.5" fill="#FFFFFF" filter="url(#cyanGlow)" />
</svg>
